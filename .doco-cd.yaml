# How doco-cd applies this repository on the droplet. It always deploys the
# current state of `production`, which CI moves only to a commit whose checks
# passed; a webhook for any other reference is refused.
name: infra
reference: production
webhook_filter: ^refs/heads/production$
working_dir: .
compose_files:
  - docker-compose.yml
remove_orphans: true
# After a deployment, remove the previous image of every service whose image
# changed (doco-cd 0.123.0, compose_deploy.go: only those IDs, and an image a
# running container uses is skipped). Old server images filled the disk once
# (24 GB, 285 images). A rollback is a revert in this repository: the image is
# pinned by digest and is pulled again from GHCR.
prune_images: true
timeout: 300
