# The production stack on the droplet, applied by doco-cd from the `production`
# branch after CI has checked it (see .doco-cd.yaml and .github/workflows/main.yml).
#
# Every image is pinned by tag and digest, so this file says exactly what runs.
# The daily dependency job updates the digests; a server release writes the
# server's version and digest here.
#
# The compose project is `infra`: the volume and the network keep the names they
# had before doco-cd, `infra_torrent-tv-server-static` and `infra_default`, and the
# `wand` project on the same host joins `infra_default` as an external network.

name: infra

volumes:
  torrent-tv-server-cache:
  torrent-tv-server-static:
    name: infra_torrent-tv-server-static

# The server runs in two slots (torrent-tv/meta#94). One serves; a release
# writes its image into the other — the slot that names the older version — and
# the new instance takes the proxies' tunnels over from the serving one, then
# the pages, while the old one finishes the signalling under way and stands by.
# nginx sends every request to either slot and, when it answers 503, to the
# other. Both slots share the cache, which only the serving one holds open, and
# the volume of the page, where every start writes its own release and the
# serving one points `current` at it. A standby slot costs one idle process,
# about 80 MB on the droplet.
x-server: &server
  restart: unless-stopped
  expose:
    - "8080"
  # Logs go to the host journal, so they outlive the container that every
  # deployment recreates; rsyslog then writes them to a file named by the tag
  # (host/logs/, README "Logs"). TTV_LOG_DRIVER chooses another driver at start,
  # e.g. json-file where there is no journald. Both slots write under one tag;
  # the handover lines name their slot (`[instance a]`).
  logging:
    driver: ${TTV_LOG_DRIVER:-journald}
    options:
      tag: torrent-tv-server
  volumes:
    - torrent-tv-server-cache:/app/cache
    - torrent-tv-server-static:/app/public-volume

x-server-environment: &server-environment
  PORT: "8080"
  # Secrets come from GitHub through the deploy pipeline (README, "Secrets");
  # an unset one disables its provider without preventing startup.
  TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
  OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
  JIMAKU_API_KEY: ${JIMAKU_API_KEY:-}
  STASHDB_API_KEY: ${STASHDB_API_KEY:-}
  THEPORNDB_API_KEY: ${THEPORNDB_API_KEY:-}
  SERVER_CACHE_DIR: /app/cache
  SERVER_CACHE_MIB: "1024"
  SERVER_CACHE_RESERVE_MIB: "256"

services:
  server-a:
    <<: *server
    image: ghcr.io/torrent-tv/server:0.48.1@sha256:cca8f766ef5b805a8e49ebddba780ddd43cbc7a2a5ac7de5cd6c8a79dc1f5527
    environment:
      <<: *server-environment
      SERVER_SLOT: "a"
      SERVER_PEER: "server-b:8080"

  server-b:
    <<: *server
    image: ghcr.io/torrent-tv/server:0.48.2@sha256:a9687e4b49912b21ef808c8620cb536de1f284a1e6b39c08c8fea795af2e728c
    environment:
      <<: *server-environment
      SERVER_SLOT: "b"
      SERVER_PEER: "server-a:8080"

  nginx:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: unless-stopped
    ports:
      - "80:80"
    # The same as the server's: the journal, a file per source, TTV_LOG_DRIVER.
    logging:
      driver: ${TTV_LOG_DRIVER:-journald}
      options:
        tag: torrent-tv-nginx
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - torrent-tv-server-static:/var/www/static/torrent-tv/server:ro
    labels:
      # A change of the configuration is not a reason to recreate nginx: doco-cd
      # updates the files in place and sends SIGHUP, and nginx reloads. The master
      # process checks the new configuration first; one it rejects is logged and
      # the old one keeps serving. CI then sees the unchanged revision
      # (/_infra/revision) and fails the deployment.
      cd.doco.deployment.recreate.ignore: "{bindMounts: [/etc/nginx/conf.d]}"
      cd.doco.deployment.recreate.ignore.signal: "SIGHUP"
    depends_on:
      - server-a
      - server-b
