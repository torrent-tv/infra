# rsyslog: a text file per source for the project's containers on the droplet.
# Installed by hand as /etc/rsyslog.d/30-torrent-tv.conf (see README, "Logs").
#
# The containers log through Docker's journald driver (docker-compose.yml and
# host/doco-cd/docker-compose.yml, `logging:`), so every line is in the host
# journal and survives the container being recreated by a deployment. journald
# forwards to rsyslog (Ubuntu's ForwardToSyslog=yes), and this file writes one
# file per source under /var/log/torrent-tv/. The journal stays the complete
# record; these files are the same lines, kept in plain text and named by source.
#
# The source is the container's tag, which rsyslog sees as the program name.
# Lines the browser sent to the server (`POST /api/client-logs`) arrive in the
# server's output; the route prefixes each one with `[client `
# (server/routes/api/client-logs/post.js), and that prefix is what puts them in
# client.log. The server's own lines never begin with it.
#
# Numbered before 50-default.conf, and each branch ends with `stop`, so these
# lines are not also copied into /var/log/syslog.

template(name="TorrentTvFile" type="string"
         string="%TIMESTAMP:::date-rfc3339% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

if $programname == "torrent-tv-server" then {
  if re_match($msg, "^ ?[[]client ") then {
    action(type="omfile" file="/var/log/torrent-tv/client.log" template="TorrentTvFile"
           fileGroup="adm" fileCreateMode="0640" dirCreateMode="0755")
  } else {
    action(type="omfile" file="/var/log/torrent-tv/server.log" template="TorrentTvFile"
           fileGroup="adm" fileCreateMode="0640" dirCreateMode="0755")
  }
  stop
}

if $programname == "torrent-tv-nginx" then {
  action(type="omfile" file="/var/log/torrent-tv/nginx.log" template="TorrentTvFile"
         fileGroup="adm" fileCreateMode="0640" dirCreateMode="0755")
  stop
}

if $programname == "torrent-tv-doco-cd" then {
  action(type="omfile" file="/var/log/torrent-tv/doco-cd.log" template="TorrentTvFile"
         fileGroup="adm" fileCreateMode="0640" dirCreateMode="0755")
  stop
}
