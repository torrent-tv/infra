# The server runs in two slots, and one of them serves at a time; the other
# answers 503 to everything but its health (torrent-tv/meta#94). nginx sends a
# request to either and, on a 503 or a refused connection, to the other, so
# the client always reaches the slot that serves — also during a release, when
# the new slot takes the proxies over and then the pages. A 503 is the slot's
# answer, not a failure of it, so no slot is ever marked down (max_fails=0);
# otherwise both could be marked down at the moment they change roles.
# The names are resolved through Docker's DNS while nginx runs, so a slot that
# is recreated or does not exist yet is picked up without a reload.
upstream torrent_tv_server {
    zone torrent_tv_server 64k;
    resolver 127.0.0.11 valid=10s;
    server server-a:8080 resolve max_fails=0;
    server server-b:8080 resolve max_fails=0;
}

server {
    listen 80;
    server_name webauth.courses;

    include /etc/nginx/conf.d/compression.common;

    # The page of the slot that serves: it points `current` at its own release
    # when it starts to serve (server/services/static-release.js).
    root /var/www/static/torrent-tv/server/current;

    # For doco-cd below, named through Docker's DNS.
    resolver 127.0.0.11 valid=10s;

    # A refused request goes to the other slot, a POST included: a slot that
    # answers 503 has done nothing with it.
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;

    # The handover between the slots is for the slots alone.
    location /internal/ {
        return 404;
    }

    # Static files served directly by nginx.
    # Falls back to Node.js for anything not found on disk
    # (API routes, /vendor/, /health, /healthz).
    location / {
        try_files $uri $uri/ @node;
        # Browsers and Cloudflare must revalidate every asset on each request
        # (nginx sends ETags, so unchanged files are cheap 304s). Without
        # this, ES modules were cached without any Cache-Control and clients
        # got a stale/mixed frontend after every deploy (e.g. new index.html
        # with an old player.js).
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /ws/ {
        proxy_pass http://torrent_tv_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    include /etc/nginx/conf.d/revision.common;

    # doco-cd, which applies this repository on the host. From outside only the
    # signed webhook and the state of one deployment run are reachable; doco-cd
    # refuses an unsigned webhook and an API request without its key.
    location = /_deploy/v1/webhook {
        limit_except POST { deny all; }
        set $doco http://doco-cd:80;
        rewrite ^/_deploy(/.*)$ $1 break;
        proxy_pass $doco;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location ~ ^/_deploy/v1/api/run/[0-9a-f-]+$ {
        limit_except GET { deny all; }
        set $doco http://doco-cd:80;
        rewrite ^/_deploy(/.*)$ $1 break;
        proxy_pass $doco;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location @node {
        proxy_pass http://torrent_tv_server;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
