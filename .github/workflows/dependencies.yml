name: Dependencies

# Daily: move each pinned image to the digest its tag points to now (nginx follows
# its main line this way), push the change to main and start the main workflow,
# which checks it and deploys it. Fails while doco-cd has a release newer than the
# pinned one, since doco-cd is updated by hand.
#
# Also daily: check that the droplet still has room for the next server image, so
# a disk that fills between deployments fails a run instead of the next release
# (torrent-tv/meta#71).

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: dependencies

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Update
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Update pinned digests
        id: digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-digests.mjs
      - name: Stage the digest change
        if: always() && steps.digests.outputs.changed != ''
        run: git add -u
      - name: Commit and deploy
        if: always() && steps.digests.outputs.changed != ''
        uses: torrent-tv/.github/actions/push-to-main@main
        with:
          message: "fix(deps): update the digest of ${{ steps.digests.outputs.changed }} #ttv-386"
          workflow: main.yml
          github-token: ${{ github.token }}

  disk:
    name: Disk space
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/verify-site.mjs disk
