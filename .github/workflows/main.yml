name: Main

# Every push to main is checked; a checked commit is then applied on the droplet
# by doco-cd. CI never logs in to the host: it moves the `production` branch, which
# doco-cd deploys, and verifies the live site from outside.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # A newer push to a pull request makes its older checks pointless; every push to
    # main gets a group of its own, so no check of main is ever replaced.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || format('checks-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: torrent-tv/.github/actions/checks@main
        with:
          node: "false"
          extra-check: |
            # Every image is pinned by digest, so the file says exactly what runs.
            if grep -hE '^\s+image:' docker-compose.yml host/doco-cd/docker-compose.yml | grep -v '@sha256:'; then
              echo "::error::an image above is not pinned by digest"
              exit 1
            fi
            docker compose -f docker-compose.yml config --quiet
            docker compose -f host/doco-cd/docker-compose.yml config --quiet
            # The configuration, checked by the nginx image that will run it.
            image=$(sed -nE 's/^\s+image:\s+(nginx:\S+)$/\1/p' docker-compose.yml)
            docker run --rm -v "$PWD/nginx:/etc/nginx/conf.d:ro" "$image" nginx -t
            # A change under nginx/ raises the revision CI reads back after deploying.
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if [ -n "$base" ] && ! [[ "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              node scripts/check-nginx-revision.mjs "$base..${{ github.sha }}"
            fi

  deploy:
    name: Deploy
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://webauth.courses
    # One deployment at a time and every one of them: while this job moves
    # `production`, applies and verifies its commit, nothing else moves the branch.
    concurrency:
      group: production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Deployment configured?
        id: configured
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::notice::DEPLOY_URL is not set in the production environment; nothing is deployed (see torrent-tv/meta#93)"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.configured.outputs.on == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: steps.configured.outputs.on == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Proxies connected before
        if: steps.configured.outputs.on == 'true'
        run: node scripts/verify-site.mjs proxies > "$RUNNER_TEMP/proxies-before.json"

      # The secrets live only in GitHub. They are sent over an SSH key that can run
      # one command on the droplet (host/secrets/apply-secrets.sh, forced in
      # authorized_keys), which writes them where doco-cd reads its environment.
      # Before the apply, so the deployment that follows starts the services with them.
      - name: Deliver the secrets
        if: steps.configured.outputs.on == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          JIMAKU_API_KEY: ${{ secrets.JIMAKU_API_KEY }}
          STASHDB_API_KEY: ${{ secrets.STASHDB_API_KEY }}
          THEPORNDB_API_KEY: ${{ secrets.THEPORNDB_API_KEY }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::notice::DEPLOY_SSH_KEY, DEPLOY_SSH_HOST or DEPLOY_SSH_KNOWN_HOSTS is not set; the secrets are not delivered"
            exit 0
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          for name in TMDB_READ_TOKEN OPENSUBTITLES_API_KEY JIMAKU_API_KEY STASHDB_API_KEY THEPORNDB_API_KEY; do
            value=${!name}
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value"; fi
          done | ssh -i "$RUNNER_TEMP/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "root@$SSH_HOST" ttv-apply-secrets
          rm -f "$RUNNER_TEMP/deploy_key"

      - name: Move production and apply
        id: deploy
        if: steps.configured.outputs.on == 'true'
        env:
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          API_SECRET: ${{ secrets.DEPLOY_API_SECRET }}
        # While the deployment is applied, the watcher asks for the list of
        # proxies as a connecting page would; with two server slots a failed
        # answer or an empty list fails the job (verify-site.mjs, torrent-tv/meta#94).
        run: |
          node scripts/verify-site.mjs watch "$RUNNER_TEMP/proxies-before.json" &
          watcher=$!
          deployed=0
          node scripts/deploy.mjs || deployed=$?
          kill -TERM "$watcher"
          watched=0
          wait "$watcher" || watched=$?
          if [ "$deployed" -ne 0 ]; then exit "$deployed"; fi
          exit "$watched"

      - name: Site after the deployment
        if: steps.configured.outputs.on == 'true' && steps.deploy.outputs.outcome != 'stale'
        run: node scripts/verify-site.mjs check "$RUNNER_TEMP/proxies-before.json"

      - name: Page after the deployment
        if: steps.configured.outputs.on == 'true' && steps.deploy.outputs.outcome != 'stale'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node scripts/verify-page.mjs
